<!doctype html><html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400..900;1,9..144,400..900&family=Bricolage+Grotesque:opsz,wdth,wght@12..96,75..100,400..800&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:1200px;height:630px;overflow:hidden;background:#191917;color:#eeeadd}
.card{position:relative;width:1200px;height:630px;padding:56px 64px;font-family:'Bricolage Grotesque',sans-serif}
.kicker{font:700 22px/1 'Bricolage Grotesque';letter-spacing:.16em;text-transform:uppercase;color:#ff66a5}
.head{position:absolute;left:64px;top:128px;width:690px}
.l1{display:block;font:800 {{size}}px/.86 'Bricolage Grotesque';font-variation-settings:'wdth' 75,'opsz' 96;letter-spacing:.012em;text-transform:uppercase;transform:rotate(-3deg);transform-origin:left bottom}
.l2{display:inline-block;margin-top:14px;background:#ff66a5;color:#191917;font:italic 600 108px/1 'Fraunces';letter-spacing:-.05em;padding:0 .14em .12em .06em;transform:rotate(-2.5deg)}
.sub{position:absolute;left:64px;top:456px;width:660px;font:italic 400 32px/1.2 'Fraunces';color:#eeeadd}
.pk{display:block;color:#ff66a5;font-style:normal;font-weight:600}
.foot{position:absolute;left:64px;bottom:44px;font:700 19px/1 'Bricolage Grotesque';letter-spacing:.12em;text-transform:uppercase;color:#eeeadd;opacity:.75}
.photo{position:absolute;right:72px;top:104px;width:330px;height:400px;background:#eeeadd;padding:14px 14px 14px;transform:rotate(3.5deg);box-shadow:10px 10px 0 #ff66a5}
.photo img{width:100%;height:100%;object-fit:cover;display:block}
.tape{position:absolute;right:190px;top:84px;width:120px;height:34px;background:rgba(255,102,165,.85);transform:rotate(-6deg);z-index:2}
.rule{position:absolute;left:0;bottom:0;width:100%;height:10px;background:#ff66a5}
</style></head><body><div class="card">
<p class="kicker">{{kicker}}</p>
<h1 class="head"><span class="l1">{{l1}}</span><span class="l2">{{l2}}</span></h1>
<p class="sub">{{sub}}</p>
<div class="tape"></div><div class="photo"><img src="{{imgsrc}}"></div>
<p class="foot">{{foot}}</p><div class="rule"></div>
</div></body></html>

url: "https://www.outragedracooncoaching.com" # the base hostname & protocol for your site, e.g. http://example.com
title: "Outraged Racoon Coaching" # the name of your site, e.g. ACME Corp.
description: "Valerie Dryden — VP Engineering and ILM certified Executive Coach based in Scotland, working remotely worldwide. No-bullshit coaching for the messy, human, hard parts of working in tech."
author: "Valerie Dryden"
locale: 'en_GB'
permalink: /:year/:month/:day/:title.html
twitter:
  username: outragedracoon
  card: summary
# Course sale. Set active: false to end it and revert all prices to full.
sale:
  active: false
  full_price: "£400"
  price: "£200"
  saving: "£200"
  code: "RACOONFRIEND"
  blurb: "Celebrating 3 years of holy shit!"
# Contact form: the Google Apps Script web app URL (see apps-script/contact-form.gs).
# Empty = the form shows the email fallback instead of sending.
contact_form_endpoint: "https://script.google.com/macros/s/AKfycbyrSH3RnU_aZeRpKyAheNw72UDzMUXegDzlxouagbVdSyZyvKArv-5YdUXkEGd2QxBc/exec"
plugins:
  - jekyll-seo-tag
  - jekyll-feed
  - jekyll-sitemap
sass:
  style: compressed
defaults:
  - scope:
      path: ""
    values:
      image: /assets/images/site/racoon.jpg
      subtitle: VP Eng | ILM Executive Coach | Neurodivergent | Chief Racoon Officer
  - scope:
      path: ""
      type: posts
    values:
      show_cta: false
      body_class: poster-home poster-post
# Private working files: never publish
exclude:
  - Gemfile
  - Gemfile.lock
  - vendor
  - node_modules
  - AGENTS.md
  - context
  - blogs_todo
  - tasks.md
  - todo.md
  - sales_todo.md
  - seo_todo.md
  - ssl.todo
  - apps-script
